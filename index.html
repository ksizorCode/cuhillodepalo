<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuchillín de Palu</title>
  
  <!-- Manifest para PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Ícono de la app -->
  <link rel="icon" href="img/icon-192x192.png">
  
  <!-- Hoja de estilos -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Librería Masonry (CDN) -->
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
</head>
<body>
  <header>
    <h1>Cuchillín de Palu</h1>
    <div class="filter-container">
      <!-- Campo de búsqueda -->
      <input type="text" id="search" placeholder="Buscar...">
      <!-- Filtro por tipo -->
      <select id="filter">
        <option value="todos">Todos</option>
        <option value="restaurante">Restaurante</option>
        <option value="sidrería">Sidrería</option>
        <option value="pastelería">Pastelería</option>
        <option value="pasta">Lugar de Pasta</option>
        <option value="sitio">Sitio Gastronómico</option>
      </select>
      <div class="view-toggle">
        <button id="gridView" class="active">Vista Retícula</button>
        <button id="listView">Vista Lista</button>
      </div>
    </div>
  </header>
  
  <main>
    <!-- Contenedor para las tarjetas -->
    <ul id="restaurant-grid">
      <!-- Aquí se insertarán los <li> con la clase "restaurant-card" -->
    </ul>
  </main>
  
  <!-- Script principal -->
  <script src="script.js"></script>
  
  <!-- Registro del Service Worker -->
  <script>
    /*
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(registration => console.log('Service Worker registrado con éxito', registration))
        .catch(error => console.error('Error registrando el Service Worker', error));
    }
        */
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
  const gridViewBtn = document.getElementById('gridView');
  const listViewBtn = document.getElementById('listView');
  const restaurantGrid = document.getElementById('restaurant-grid');

  // Función para activar grid view
  function setGridView() {
    restaurantGrid.classList.remove('list-view');
    gridViewBtn.classList.add('active');
    listViewBtn.classList.remove('active');
  }

  // Función para activar list view
  function setListView() {
    restaurantGrid.classList.add('list-view');
    listViewBtn.classList.add('active');
    gridViewBtn.classList.remove('active');
  }

  // Asigna los event listeners a los botones
  gridViewBtn.addEventListener('click', setGridView);
  listViewBtn.addEventListener('click', setListView);

  // Aquí iría el resto de tu código para cargar y renderizar las tarjetas...
});
  </script>
</body>
</html>
